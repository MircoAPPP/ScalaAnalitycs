<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScalaAnalytics - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <header>
        <h1>ScalaAnalytics</h1>
        <div class="status-container">
            <span>STATUS:</span>
            <span id="connection-status" class="status-disconnected">DISCONNECTED</span>
        </div>
    </header>

    <main>
        <div class="main-stats">
            <div class="stat-card">
                <h3>Giocatori Totali</h3>
                <p id="total-players">--</p>
            </div>
            <div class="stat-card">
                <h3>Utilizzo CPU Proxy</h3>
                <p id="proxy-cpu">--</p>
            </div>
            <div class="stat-card">
                <h3>Memoria Usata Proxy</h3>
                <p id="proxy-memory">--</p>
            </div>
        </div>

        <div class="chart-container">
            <h2>Andamento Giocatori Totali</h2>
            <canvas id="player-history-chart"></canvas>
        </div>

        <div id="server-list" class="server-list">
            <!-- I dati dei server verranno inseriti qui da app.js -->
        </div>
    </main>

    <footer>
        <p>ScalaAnalytics | Realizzato da Jules</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
